[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-lab"
version = "0.1.0"
description = "Research-grade cross-sectional financial signal discovery with purged walk-forward validation."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",  # EXP-008 and any reproduction run pin the exact version: requirements-exp008.txt
  "statsmodels>=0.14",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
