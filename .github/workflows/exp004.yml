name: EXP-004 Turnover-Budget Projection

on:
  push:
    paths:
      - ".github/workflows/exp004.yml"

permissions:
  contents: read
  actions: read

jobs:
  exp004:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,data]'

      - name: Run unit tests
        run: pytest

      - name: Download original frozen data artifact
        uses: actions/download-artifact@v4
        with:
          name: v0.2-freeze
          path: frozen
          github-token: \${{ github.token }}
          repository: drmshoaib/quant-research-lab
          run-id: 37189218641

      - name: Verify frozen data snapshot and holdout
        run: |
          cmp frozen/configs/holdout_dates.csv configs/holdout_dates.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          meta = json.loads(Path("configs/data_snapshot.json").read_text())
          path = Path("frozen/outputs/market_data.csv")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = meta["sha256"]
          print(f"EXPECTED_SHA256={expected}")
          print(f"ACTUAL_SHA256={actual}")
          if actual != expected:
              raise SystemExit("Frozen market-data checksum mismatch; refusing to run EXP-004.")
          print("Original frozen data snapshot and holdout manifest verified.")
          PY

      - name: Run EXP-004
        run: |
          python scripts/run_exp004.py \
            --data frozen/outputs/market_data.csv \
            --output-dir outputs/exp004

      - name: Print EXP-004 compact summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path("outputs/exp004/summary.json").read_text())
          compact = {
              "protocol": s["protocol"],
              "rank_ic_reference": {
                  "mean": s["rank_ic_reference"]["mean"],
                  "hac": s["rank_ic_reference"]["hac"],
                  "median_fold_ic": s["rank_ic_reference"]["median_fold_ic"],
                  "positive_year_fraction": s["rank_ic_reference"]["positive_year_fraction"],
              },
              "instant_benchmark": {
                  "ann_turnover": s["instant_benchmark"]["base_cost"]["ann_turnover"],
                  "ann_return_0bps": s["instant_benchmark"]["cost_sensitivity"]["0"]["ann_return"],
                  "ann_return_5bps": s["instant_benchmark"]["base_cost"]["ann_return"],
                  "sharpe_5bps": s["instant_benchmark"]["base_cost"]["sharpe"],
              },
              "candidates": {
                  k: {
                      "ann_turnover": v["portfolio"]["base_cost"]["ann_turnover"],
                      "turnover_reduction": v["turnover_reduction"],
                      "ann_return_0bps": v["portfolio"]["cost_sensitivity"]["0"]["ann_return"],
                      "zero_cost_return_retention": v["zero_cost_return_retention"],
                      "ann_return_5bps": v["portfolio"]["base_cost"]["ann_return"],
                      "sharpe_5bps": v["portfolio"]["base_cost"]["sharpe"],
                      "tracking_error_mean": v["tracking_error_mean"],
                      "tracking_error_p95": v["tracking_error_p95"],
                      "binding_fraction": v["binding_fraction"],
                      "fallback_count": v["fallback_count"],
                      "fallback_rate": v["fallback_rate"],
                      "qualification_gates": v["qualification_gates"],
                      "qualifies": v["qualifies"],
                  }
                  for k, v in s["candidates"].items()
              },
              "selected_turnover_budget": s["selected_turnover_budget"],
          }
          print("EXP004_COMPACT_BEGIN")
          print(json.dumps(compact, indent=2))
          print("EXP004_COMPACT_END")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp004-development-results
          path: outputs/exp004
          retention-days: 90
