name: EXP-002 Attribution and Turnover

on:
  push:
    paths:
      - ".github/workflows/exp002.yml"

permissions:
  contents: read
  actions: read

jobs:
  exp002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,data]'

      - name: Run unit tests
        run: pytest

      - name: Download original frozen data artifact
        uses: actions/download-artifact@v4
        with:
          name: v0.2-freeze
          path: frozen
          github-token: ${{ github.token }}
          repository: drmshoaib/quant-research-lab
          run-id: 37189218641

      - name: Verify frozen data snapshot and holdout
        run: |
          cmp frozen/configs/holdout_dates.csv configs/holdout_dates.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          meta = json.loads(Path("configs/data_snapshot.json").read_text())
          path = Path("frozen/outputs/market_data.csv")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = meta["sha256"]
          print(f"EXPECTED_SHA256={expected}")
          print(f"ACTUAL_SHA256={actual}")
          if actual != expected:
              raise SystemExit("Frozen market-data checksum mismatch; refusing to run EXP-002.")
          print("Original frozen data snapshot and holdout manifest verified.")
          PY

      - name: Run EXP-002
        run: |
          python scripts/run_exp002.py             --data frozen/outputs/market_data.csv             --output-dir outputs/exp002

      - name: Print EXP-002 compact summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path("outputs/exp002/summary.json").read_text())
          compact = {
              "protocol": s["protocol"],
              "full_model": {
                  "mean_ic": s["full_model"]["rank_ic"]["mean"],
                  "hac": s["full_model"]["rank_ic"]["hac"],
                  "ann_turnover": s["full_model"]["backtest_base_cost"]["ann_turnover"],
                  "ann_return_5bps": s["full_model"]["backtest_base_cost"]["ann_return"],
                  "sharpe_5bps": s["full_model"]["backtest_base_cost"]["sharpe"],
              },
              "material_contributors": s["material_contributors"],
              "ablations": {
                  k: {
                      "mean_ic_loss": v["mean_ic_loss"],
                      "paired_hac": v["paired_hac"],
                      "bh_q_value": v["bh_q_value"],
                      "material_contributor": v["material_contributor"],
                  }
                  for k, v in s["ablations"].items()
              },
              "smoothing": {
                  k: {
                      "mean_ic": v["rank_ic"]["mean"],
                      "hac": v["rank_ic"]["hac"],
                      "ic_retention": v["ic_retention"],
                      "ann_turnover": v["backtest_base_cost"]["ann_turnover"],
                      "turnover_reduction": v["turnover_reduction"],
                      "ann_return_5bps": v["backtest_base_cost"]["ann_return"],
                      "sharpe_5bps": v["backtest_base_cost"]["sharpe"],
                      "qualification_gates": v["qualification_gates"],
                      "qualifies": v["qualifies"],
                  }
                  for k, v in s["smoothing"].items()
              },
              "selected_smoothing_span": s["selected_smoothing_span"],
          }
          print("EXP002_COMPACT_BEGIN")
          print(json.dumps(compact, indent=2))
          print("EXP002_COMPACT_END")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp002-development-results
          path: outputs/exp002
          retention-days: 90
