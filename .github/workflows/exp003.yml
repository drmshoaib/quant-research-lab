name: EXP-003 Reduced Features and Execution

on:
  push:
    paths:
      - ".github/workflows/exp003.yml"

permissions:
  contents: read
  actions: read

jobs:
  exp003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,data]'

      - name: Run unit tests
        run: pytest

      - name: Download original frozen data artifact
        uses: actions/download-artifact@v4
        with:
          name: v0.2-freeze
          path: frozen
          github-token: ${{ github.token }}
          repository: drmshoaib/quant-research-lab
          run-id: 37189218641

      - name: Verify frozen data snapshot and holdout
        run: |
          cmp frozen/configs/holdout_dates.csv configs/holdout_dates.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          meta = json.loads(Path("configs/data_snapshot.json").read_text())
          path = Path("frozen/outputs/market_data.csv")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = meta["sha256"]
          print(f"EXPECTED_SHA256={expected}")
          print(f"ACTUAL_SHA256={actual}")
          if actual != expected:
              raise SystemExit("Frozen market-data checksum mismatch; refusing to run EXP-003.")
          print("Original frozen data snapshot and holdout manifest verified.")
          PY

      - name: Run EXP-003
        run: |
          python scripts/run_exp003.py             --data frozen/outputs/market_data.csv             --output-dir outputs/exp003

      - name: Print EXP-003 compact summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path("outputs/exp003/summary.json").read_text())
          compact = {
              "protocol": s["protocol"],
              "specifications": {
                  k: {
                      "n_features": v["n_features"],
                      "mean_ic": v["rank_ic"]["mean"],
                      "hac": v["rank_ic"]["hac"],
                      "median_fold_ic": v["rank_ic"]["median_fold_ic"],
                      "positive_year_fraction": v["rank_ic"]["positive_year_fraction"],
                      "ann_turnover": v["instant_execution"]["base_cost"]["ann_turnover"],
                      "ann_return_0bps": v["instant_execution"]["cost_sensitivity"]["0"]["ann_return"],
                      "ann_return_5bps": v["instant_execution"]["base_cost"]["ann_return"],
                      "sharpe_5bps": v["instant_execution"]["base_cost"]["sharpe"],
                      "statistically_eligible": v.get("statistically_eligible"),
                  }
                  for k, v in s["specifications"].items()
              },
              "statistically_eligible_reduced_specs": s["statistically_eligible_reduced_specs"],
              "selected_feature_specification": s["selected_feature_specification"],
              "execution": {
                  k: {
                      "ann_turnover": v["portfolio"]["base_cost"]["ann_turnover"],
                      "turnover_reduction": v["turnover_reduction"],
                      "ann_return_0bps": v["portfolio"]["cost_sensitivity"]["0"]["ann_return"],
                      "zero_cost_return_retention": v["zero_cost_return_retention"],
                      "ann_return_5bps": v["portfolio"]["base_cost"]["ann_return"],
                      "sharpe_5bps": v["portfolio"]["base_cost"]["sharpe"],
                      "qualification_gates": v["qualification_gates"],
                      "qualifies": v["qualifies"],
                  }
                  for k, v in s["execution"].items()
              },
              "selected_adjustment_rate": s["selected_adjustment_rate"],
          }
          print("EXP003_COMPACT_BEGIN")
          print(json.dumps(compact, indent=2))
          print("EXP003_COMPACT_END")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp003-development-results
          path: outputs/exp003
          retention-days: 90
