name: EXP-008 Methods Re-run

on:
  push:
    paths:
      - ".github/workflows/exp008.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exp008:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      # Pinned scientific stack (Python 3.11-compatible pins verified): EXP-008 records the exact library versions in its summary,
      # and the frozen v0.2 control row is only expected to reproduce under these pins.
      - run: pip install -r requirements-exp008.txt
      - run: pip install -e . --no-deps

      - name: Download original frozen data artifact
        uses: actions/download-artifact@v4
        with:
          name: v0.2-frozen-market-data
          path: frozen
          github-token: ${{ github.token }}
          repository: drmshoaib/quant-research-lab
          run-id: 37189513253

      - name: Verify frozen data snapshot and holdout
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shutil

          matches = list(Path("frozen").rglob("market_data.csv"))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one frozen market_data.csv, found {matches}")
          source = matches[0]
          target = Path("frozen/market_data.csv")
          if source != target:
              shutil.copy2(source, target)

          meta = json.loads(Path("configs/data_snapshot.json").read_text())
          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          expected = meta["sha256"]
          print(f"EXPECTED_SHA256={expected}")
          print(f"ACTUAL_SHA256={actual}")
          if actual != expected:
              raise SystemExit("Frozen market-data checksum mismatch; refusing to run EXP-008.")
          print("Preserved frozen data snapshot verified; committed holdout manifest remains unchanged.")
          PY

      - name: Run EXP-008 (development data only)
        run: python scripts/run_exp008.py --data frozen/market_data.csv --output-dir outputs/exp008

      - name: Print EXP-008 summary
        run: |
          echo "EXP008_SUMMARY_BEGIN"
          cat outputs/exp008/summary.json
          echo "EXP008_SUMMARY_END"

      - uses: actions/upload-artifact@v4
        with:
          name: exp008-methods-results
          path: outputs/exp008
          retention-days: 90
