name: EXP-008 Methods Re-run

on:
  push:
    paths:
      - ".github/workflows/exp008.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exp008:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      # Pinned scientific stack: EXP-008 records the exact library versions in its summary,
      # and the frozen v0.2 control row is only expected to reproduce under these pins.
      - run: pip install -r requirements-exp008.txt
      - run: pip install -e . --no-deps

      - name: Download original frozen data artifact
        uses: actions/download-artifact@v4
        with:
          name: v0.2-freeze
          path: frozen
          github-token: ${{ github.token }}
          repository: drmshoaib/quant-research-lab
          run-id: 37189218641

      - name: Verify frozen data snapshot and holdout
        run: |
          cmp frozen/configs/holdout_dates.csv configs/holdout_dates.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          meta = json.loads(Path("configs/data_snapshot.json").read_text())
          path = Path("frozen/outputs/market_data.csv")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = meta["sha256"]
          print(f"EXPECTED_SHA256={expected}")
          print(f"ACTUAL_SHA256={actual}")
          if actual != expected:
              raise SystemExit("Frozen market-data checksum mismatch; refusing to run EXP-008.")
          print("Original frozen data snapshot and holdout manifest verified.")
          PY

      - name: Run EXP-008 (development data only)
        run: python scripts/run_exp008.py --data frozen/outputs/market_data.csv --output-dir outputs/exp008

      - name: Print EXP-008 summary
        run: |
          echo "EXP008_SUMMARY_BEGIN"
          cat outputs/exp008/summary.json
          echo "EXP008_SUMMARY_END"

      - uses: actions/upload-artifact@v4
        with:
          name: exp008-methods-results
          path: outputs/exp008
          retention-days: 90
