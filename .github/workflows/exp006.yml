name: EXP-006 Robustness and Falsification

on:
  push:
    paths:
      - ".github/workflows/exp006.yml"

permissions:
  contents: read
  actions: read

jobs:
  exp006:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,data]'

      - name: Run unit tests
        run: pytest

      - name: Download original frozen data artifact
        uses: actions/download-artifact@v4
        with:
          name: v0.2-freeze
          path: frozen
          github-token: ${{ github.token }}
          repository: drmshoaib/quant-research-lab
          run-id: 37189218641

      - name: Verify frozen data snapshot and holdout
        run: |
          cmp frozen/configs/holdout_dates.csv configs/holdout_dates.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          meta = json.loads(Path("configs/data_snapshot.json").read_text())
          path = Path("frozen/outputs/market_data.csv")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = meta["sha256"]
          print(f"EXPECTED_SHA256={expected}")
          print(f"ACTUAL_SHA256={actual}")
          if actual != expected:
              raise SystemExit("Frozen market-data checksum mismatch; refusing to run EXP-006.")
          print("Original frozen data snapshot and holdout manifest verified.")
          PY

      - name: Run EXP-006
        run: |
          python scripts/run_exp006.py \
            --data frozen/outputs/market_data.csv \
            --output-dir outputs/exp006

      - name: Print EXP-006 compact summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path("outputs/exp006/summary.json").read_text())
          compact = {
              "horizon_results": {
                  k: {
                      "mean_ic": v["mean"],
                      "hac": v["hac"],
                      "median_fold_ic": v["median_fold_ic"],
                      "positive_year_fraction": v["positive_year_fraction"],
                      "bh_q_value": v.get("bh_q_value"),
                      "bh_reject_q_0_10": v.get("bh_reject_q_0_10"),
                      "embargo_days": v["embargo_days"],
                  }
                  for k, v in s["horizon_results"].items()
              },
              "horizon_rule": s["horizon_rule"],
              "subperiods": s["subperiods"],
              "subperiod_pass": s["subperiod_pass"],
              "asset_groups": s["asset_groups"],
              "asset_group_rule": s["asset_group_rule"],
              "symbol_identity_placebo": s["symbol_identity_placebo"],
              "section_pass": s["section_pass"],
              "overall_robustness_pass": s["overall_robustness_pass"],
          }
          print("EXP006_COMPACT_BEGIN")
          print(json.dumps(compact, indent=2))
          print("EXP006_COMPACT_END")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp006-development-results
          path: outputs/exp006
          retention-days: 90
